name: CI

on:
  push:
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run server tests
        working-directory: server
        run: python -m unittest discover -s tests -v

  client-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install boost and crypto++
        run: sudo apt-get update && sudo apt-get install -y libboost-dev libcrypto++-dev
      - name: Build client
        run: |
          cmake -S client -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

  client-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install boost and crypto++
        run: vcpkg install cryptopp boost-asio --triplet x64-windows-static
      - name: Build client (Visual Studio)
        run: |
          cmake -S client -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
          cmake --build build --config Release
